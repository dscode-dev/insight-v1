# Shared proxy headers. Included by every location in insight-nginx.conf
# so a change lands everywhere at once instead of drifting per block.

proxy_http_version 1.1;

# Host is preserved so the upstream builds correct absolute URLs.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE upgrade. `$connection_upgrade` is defined in
# insight-upgrade.conf (http-level map) — a plain "Upgrade" here would
# break ordinary keep-alive requests.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts are NOT set here. An `include` inlines into the location
# block, so a location that needs a longer read timeout (SSE, registry
# layers) would be declaring a duplicate rather than an override. The
# defaults live at server scope in insight-nginx.conf; locations
# override them there.

# Do not let an upstream 5xx be served from cache or retried onto a
# mutation.
proxy_next_upstream error timeout;
