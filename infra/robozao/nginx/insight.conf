# Insight — reverse proxy (Robozão / WSL).
#
# Exposes exactly three surfaces and nothing else. Atlas, Explorer,
# Anvil, the Control Plane, Postgres, Redis and ClickHouse stay on the
# Docker network only — insight-context.md v2.0 requires the
# Intelligence plane to be unreachable from outside, and the way to
# guarantee that is to have no server block for it.
#
# No TLS yet (agreed). When it lands: keep these blocks, add a 443
# server, and redirect 80 → 443. Nothing here changes.

# Upstreams named so a port change is one edit, and so `nginx -T` shows
# the topology in one place.
upstream insight_console   { server 127.0.0.1:3001; keepalive 16; }
upstream insight_portainer { server 127.0.0.1:9000; keepalive 16; }
upstream docker_registry   { server 127.0.0.1:5000; keepalive 16; }

# Real client IP for logs and for anything downstream that rate-limits.
# WSL sits behind the Windows portproxy, so without this every request
# looks like it came from the WSL gateway.
map $http_x_forwarded_for $client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

log_format insight '$client_ip - [$time_local] "$request" $status '
                   '$body_bytes_sent rt=$request_time '
                   'ua="$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/insight-access.log insight;
    error_log  /var/log/nginx/insight-error.log warn;

    # The console serves its own assets; 20m is generous for the JSON
    # bodies it posts and small enough to bound an abusive upload.
    client_max_body_size 20m;
    client_body_timeout 30s;

    # Server-scope defaults. Locations override where they need longer;
    # declaring them in the shared snippet instead would make every such
    # override a duplicate.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Do not advertise the nginx version to the internet-facing side.
    server_tokens off;

    # This proxy terminates plain HTTP today, so HSTS would be a lie.
    # These three are true regardless of TLS.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Console ------------------------------------------------------
    #
    # The app is built with NEXT_PUBLIC_BASE_PATH=/console, so it already
    # emits /console/... URLs and asset paths. The prefix is therefore
    # passed through UNCHANGED — rewriting it off would break every
    # asset the HTML references.
    location /console/ {
        proxy_pass http://insight_console;
        include /etc/nginx/snippets/insight-proxy.conf;

        # Server-Sent Events: the console's realtime channels stay open,
        # and buffering would hold every event until the buffer filled.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Bare /console (no slash) — Next would otherwise 308 to a URL the
    # browser resolves against the proxy, not the upstream.
    location = /console {
        return 301 /console/;
    }

    # ---- Portainer ----------------------------------------------------
    #
    # Portainer serves from the root and does NOT support a base path,
    # so the prefix is stripped here. Its own redirects come back
    # absolute; sub_filter is not used because Portainer is a SPA that
    # builds URLs in JS — the base tag below is what makes it work.
    location /portainer/ {
        proxy_pass http://insight_portainer/;
        include /etc/nginx/snippets/insight-proxy.conf;

        # Portainer's terminal/console features are WebSocket.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Rewrite the SPA's <base> so its JS-built URLs stay under the
        # prefix. Without it Portainer requests /api/... at the root and
        # 404s through this proxy.
        sub_filter '<base href="/"' '<base href="/portainer/"';
        sub_filter_once on;
        # text/html is already in sub_filter_types by default; repeating
        # it makes nginx warn about a duplicate MIME type.
    }

    location = /portainer {
        return 301 /portainer/;
    }

    # ---- Docker registry ----------------------------------------------
    #
    # Preserved from the previous config. The Docker client always calls
    # /v2/, so it gets its own location rather than a prefix.
    location /v2/ {
        proxy_pass http://docker_registry;
        include /etc/nginx/snippets/insight-proxy.conf;

        # Image layers are large and slow; the defaults would abort them.
        client_max_body_size 0;
        chunked_transfer_encoding on;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        if ($http_user_agent ~* (DockerClient)) {
            add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;
        }
    }

    # ---- Everything else ----------------------------------------------
    #
    # Default-deny. A request that matches no location above reaches no
    # service — which is the whole point of listing the three that are
    # allowed.
    location / {
        return 404;
    }

    # Liveness for the proxy itself, so a monitor can tell "nginx is
    # down" from "the console is down".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
