# http-level map for WebSocket/SSE upgrades.
#
# Must live at http scope (conf.d), not inside a server block. Sending
# `Connection: upgrade` on every request would break keep-alive for the
# ordinary ones, so the value is derived from whether the client
# actually asked to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
