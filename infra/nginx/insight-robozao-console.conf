# Host Nginx reverse proxy for the Insight Operations Console.
# The console container publishes port 3001 only on the host loopback.
#
# SSH is not handled by Nginx and remains untouched on port 22.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name insight-robozao.konohalabs.lab;

    access_log /var/log/nginx/insight-robozao-console.access.log;
    error_log  /var/log/nginx/insight-robozao-console.error.log warn;

    client_max_body_size 10m;
    client_body_timeout 15s;
    keepalive_timeout 65s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /console {
        return 302 /console/dashboard;
    }

    location /console/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /console;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }

    location = / {
        return 404;
    }
}
