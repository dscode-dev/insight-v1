# Infraestrutura local do PR-02 — e nada além do que ele usa.
#
# DOIS SERVIÇOS, PORQUE SÃO DOIS OS QUE O CÓDIGO EXERCITA. Redis, ClickHouse e
# pgvector estão nos ADRs e não têm uma linha de código que fale com eles. Um
# compose que sobe seis contêineres para exercitar dois cobra RAM de quem
# desenvolve todo dia e transforma `docker compose up` numa espera — que é como
# um ambiente local deixa de ser usado.
#
# OS SEGREDOS AQUI SÃO DE DESENVOLVIMENTO E ESTÃO À VISTA DE PROPÓSITO. Um
# `minioadmin` que não se esconde é reconhecível como local; um segredo
# "escondido" em compose committado é o mesmo segredo com a aparência de
# proteção. Em produção nada disto se aplica: `SecuritySettings` e
# `ObjectStoreSettings` não têm default, e o processo não sobe sem os valores.
#
#   docker compose -f infra/docker-compose.yml up -d
#   ENGINE_POSTGRES_HOST=localhost ... engine migrate

name: sports-intelligence-engine

services:
  postgres:
    image: postgres:17-alpine
    container_name: sie-postgres
    environment:
      POSTGRES_DB: sports_intelligence
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine_local
      # Locale determinístico: `ORDER BY` sobre nome de time muda de resultado
      # conforme o locale do contêiner, e um teste que ordena passa na máquina
      # de um e falha na de outro.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` COM usuário e banco: sem eles ele responde que o servidor
      # está de pé antes de o banco da aplicação existir, e a migration que
      # roda em seguida falha por "database does not exist".
      test: ["CMD-SHELL", "pg_isready -U engine -d sports_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: sie-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Cria o bucket uma vez e sai. EXISTE PARA QUE O SERVIÇO NÃO CRIE O PRÓPRIO
  # BUCKET: em produção ele é provisionado fora, com retenção, versionamento e
  # cifra decididos por quem responde por eles — e um serviço que cria o
  # próprio bucket cria um com os defaults do provedor, cujo default de
  # retenção costuma ser "nenhuma".
  minio-bucket:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: sie-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sports-intelligence-raw &&
      mc version enable local/sports-intelligence-raw &&
      echo 'bucket pronto, com versionamento'
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
