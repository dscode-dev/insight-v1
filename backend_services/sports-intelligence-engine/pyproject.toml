[project]
name = "sports-intelligence-engine"
version = "0.1.0"
description = "Insight Sports Intelligence Engine — motor de tendências contextualizadas e explicáveis para futebol"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# CADA DEPENDÊNCIA ENTRA NO PR QUE A USA, e sai da lista quem não usa.
#
# ClickHouse, Redis, pgvector, NumPy, SciPy e OpenTelemetry continuam de fora:
# estão declarados nos ADRs e nenhum PR os exercita ainda. Uma dependência que
# entra antes do primeiro uso vira peso no build, superfície de CVE e uma
# decisão que ninguém lembra de rever. O `doctor` da CLI reporta as que faltam.
#
# As quatro do PR-02 e o que cada uma faz aqui:
#   asyncpg    o registro transacional; sem ORM, por decisão (ADR-0003)
#   aioboto3   S3 e MinIO pelo mesmo cliente, sem segurar thread no upload
#   pyarrow    o rodapé do Parquet — schema e contagem sem ler os dados
#   polars     inferência de tipo em Rust, sobre amostra, fora da RAM
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "rich>=13.9",
    "asyncpg>=0.30",
    "aioboto3>=13.2",
    "pyarrow>=18.0",
    "polars>=1.17",
    # A BASE DE FUSOS DO SISTEMA, e não uma conveniência. O motor grava
    # `timestamp(us, tz=UTC)` no Parquet, e ler essas colunas de volta exige
    # que o `zoneinfo` encontre a base — que existe no Linux e NÃO existe no
    # Windows. Sem ela, um dataset perfeitamente gravado é ilegível na máquina
    # ao lado, com uma mensagem que fala de módulo ausente e não de fuso
    # (PR-05.5.1: aqui o Parquet é a fonte das linhas, e não uma cópia).
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage[toml]>=7.6",
    # Sobem PostgreSQL e MinIO de verdade nos testes de integração. Ver
    # `tests/integration/conftest.py`: quando o ambiente já oferece os dois
    # (compose local, CI), os testes usam esses e o Testcontainers nem carrega.
    "testcontainers[postgres]>=4.8",
    "types-aioboto3>=13.2",
]

[project.scripts]
engine = "apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_intelligence", "apps"]

# ---------------------------------------------------------------- ruff -----

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "apps", "tests"]

# O LINTER NÃO PODE HERDAR OS PONTOS CEGOS DO GIT (PR-04.2.1 §23).
#
# Por padrão o Ruff respeita `.gitignore`, e a combinação com uma regra ampla
# demais — um `build/` sem barra inicial, no `.gitignore` do monorepo — fez
# `domain/build/` e `historical/build/` ficarem INVISÍVEIS para o lint. Dois
# pacotes inteiros passaram por «All checks passed» sem nunca terem sido
# lidos, e sete achados apareceram no instante em que o ignore foi corrigido.
#
# `false` DESLIGA SÓ O GITIGNORE. Os excludes próprios do Ruff continuam
# valendo — `.venv`, `__pycache__`, `.mypy_cache` e companhia não voltam.
# O que passa a ser lido é exatamente o que deveria: o código.
respect-gitignore = false

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "BLE",       # except cego
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",       # ruff-specific
    "ANN",       # type annotations — o core é integralmente tipado
    "DTZ",       # datetime sem timezone é erro, não estilo
    "PT",        # pytest style
]
ignore = [
    "ANN401",  # `Any` é proibido por convenção, não por regra: onde ele é
               # inevitável (payload de evento) o motivo está escrito.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
# Import relativo atravessando pacote esconde a direção da dependência, que é
# exatamente o que os testes de arquitetura protegem.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sports_intelligence", "apps"]

# ---------------------------------------------------------------- mypy -----

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false   # ver ANN401 acima
show_error_codes = true
pretty = true
files = ["src", "apps", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Bibliotecas sem stubs completos. `ignore_missing_imports` e NÃO `Any` no
# nosso lado: a fronteira com elas fica em `adapters/` e `ingestion/`, e o
# tipo do que sai de lá é declarado por nós.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "testcontainers.*", "asyncpg.*", "pyarrow.*"]
ignore_missing_imports = true

# -------------------------------------------------------------- pytest -----

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "architecture: falha o CI quando um limite arquitetural é violado",
    "smoke: prova que o processo sobe e responde",
    "integration: exige PostgreSQL e object store de verdade",
    "performance: mede tempo e memória; não afirma SLO",
    "property: prova uma INVARIANTE sobre todo um conjunto de entradas",
]

[tool.coverage.run]
source = ["src/sports_intelligence", "apps"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
