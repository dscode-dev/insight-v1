[tool.poetry]
name = "insight-anvil"
version = "0.1.0"
description = "Anvil (Insight Layer F/E) — analytics worker: derived stream → ClickHouse"
authors = ["KonohaLabs <dev@konohalabs.com>"]
packages = [{ include = "anvil" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
clickhouse-connect = "^0.8.0"
orjson = "^3.10.7"
pydantic = "^2.7.4"
pydantic-settings = "^2.4.0"
redis = "^5.0.7"

# Observability — exporter is env-driven.
prometheus_client = "^0.20"
opentelemetry-api = "^1.27"
opentelemetry-sdk = "^1.27"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.3"
pytest = "^8.0"
# Fake ClickHouse over HTTP for tests. Lightweight; uses the same wire
# protocol the production client speaks.
clickhouse-connect = "^0.8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
