syntax = "proto3";

package social.v1;

option go_package = "github.com/konoha-labs/insight-protos/gen/go/social/v1;socialv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Posts, comments and likes — Sprint 3 (Social Foundation).
// Text-only V1: no media, no hashtags, no reaction catalog.

enum AuthorType {
  AUTHOR_TYPE_UNSPECIFIED = 0;
  AUTHOR_TYPE_USER = 1;
  AUTHOR_TYPE_AGENT = 2;
  AUTHOR_TYPE_ADMIN = 3;
}

enum PostVisibility {
  POST_VISIBILITY_UNSPECIFIED = 0;
  POST_VISIBILITY_PUBLIC = 1;
  POST_VISIBILITY_COMPETITION = 2;
  POST_VISIBILITY_PRIVATE = 3;
}

message Post {
  string id = 1;
  string author_id = 2;
  AuthorType author_type = 3;
  string content = 4;
  map<string, string> metadata = 5;
  PostVisibility visibility = 6;
  google.protobuf.Timestamp created_at = 7;
  int64 like_count = 8;
  int64 comment_count = 9;
  // Reposts + external shares, summed. Sits beside like_count and
  // comment_count because a reader treats all three the same way.
  int64 share_count = 13;
  // The competition this post belongs to, when it belongs to one.
  //
  // The public feed is partitioned by competition: the app shows a horizontal
  // rail under the header, and picking one filters the feed to it. A post
  // without a competition is platform-wide and appears whatever the selection.
  //
  // MANDATORY when visibility is POST_VISIBILITY_COMPETITION — the database
  // enforces the pair (posts_competition_scope_check), because a
  // competition-scoped post that names no competition cannot be placed in any
  // rail and would silently vanish from every filtered view.
  //
  // Carries the competition's UUID, not its slug: the slug is editable from
  // the console and a post must not detach when a competition is renamed.
  optional string competition_id = 10;
  // Denormalised for rendering — the client draws the rail chip on the post
  // without a second call. Never accepted on write; Social fills it in.
  optional string competition_slug = 11;
  optional string competition_name = 12;
}

message CreatePostRequest {
  string author_id = 1;
  AuthorType author_type = 2;
  string content = 3;
  map<string, string> metadata = 4;
  PostVisibility visibility = 5;
  // Must name a competition registered in the console. Social rejects an
  // unknown id rather than storing it: competitions are a registry, and the
  // foreign key is what makes "does not exist in Insight unless registered"
  // true rather than merely intended.
  optional string competition_id = 6;
}

message GetPostRequest {
  string id = 1;
}

message DeletePostRequest {
  string id = 1;
  // The caller's identity — only the author (or an admin) may delete.
  string requester_id = 2;
}

// Comments: post → comment → reply. Maximum depth 2; no nested trees.
message Comment {
  string id = 1;
  string post_id = 2;
  // Empty for top-level comments; the parent comment id for replies.
  string parent_id = 3;
  string author_id = 4;
  AuthorType author_type = 5;
  string content = 6;
  int32 depth = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateCommentRequest {
  string post_id = 1;
  string parent_id = 2;
  string author_id = 3;
  AuthorType author_type = 4;
  string content = 5;
}

message ListCommentsRequest {
  string post_id = 1;
  optional int32 limit = 2;
  optional string cursor = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  optional string next_cursor = 2;
}

// A repost onto the sharer's own timeline, or the post leaving Insight.
//
// They differ in what they mean, not in shape. A repost is a STATE — you have
// reposted a post or you have not, and the button is a toggle. An external
// share is an EVENT: the same person sends the same post to two friends, and
// deduplicating that would undercount exactly what the metric measures.
enum ShareTarget {
  SHARE_TARGET_UNSPECIFIED = 0;
  // Repost. Idempotent: sharing twice leaves one, and `created` says which
  // happened so the client can tell a fresh repost from a no-op.
  SHARE_TARGET_FEED = 1;
  // Left the platform — a copied link, a send to another app. Repeatable.
  SHARE_TARGET_EXTERNAL = 2;
}

message SharePostRequest {
  string post_id = 1;
  string user_id = 2;
  ShareTarget target = 3;
  // Where an external share went ("whatsapp", "copy_link"), when the client
  // knows. Never required — the client often cannot tell, and a mandatory
  // field would be filled with a guess. Rejected on a repost, where it would
  // be a value nobody can interpret.
  optional string channel = 4;
}

message SharePostResponse {
  // False when a repost already existed. The row is unchanged and the count
  // did not move; without this the client cannot distinguish "done" from
  // "already done" and would animate a state change that never happened.
  bool created = 1;
  // The post's share count after this call — both kinds summed, which is what
  // "compartilhamentos" means to someone reading a post.
  int64 share_count = 2;
}

message UnsharePostRequest {
  string post_id = 1;
  string user_id = 2;
}

// Likes — the only V1 reaction.
message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message UnlikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

service PostService {
  rpc Create(CreatePostRequest) returns (Post);
  rpc Get(GetPostRequest) returns (Post);
  rpc Delete(DeletePostRequest) returns (google.protobuf.Empty);
  rpc CreateComment(CreateCommentRequest) returns (Comment);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc Like(LikePostRequest) returns (google.protobuf.Empty);
  rpc Unlike(UnlikePostRequest) returns (google.protobuf.Empty);

  // Compartilhamento. Two kinds behind one call — see ShareTarget.
  rpc Share(SharePostRequest) returns (SharePostResponse);
  // Undoes a repost only. An external share is an event that already
  // happened somewhere else; there is nothing to take back.
  rpc Unshare(UnsharePostRequest) returns (google.protobuf.Empty);
}
