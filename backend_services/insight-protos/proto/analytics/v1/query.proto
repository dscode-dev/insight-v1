syntax = "proto3";

package analytics.v1;

option go_package = "github.com/konoha-labs/insight-protos/gen/go/analytics/v1;analyticsv1";

import "google/protobuf/timestamp.proto";

// One sample on a pressure/momentum/odds timeline. The Analytics
// service reads these from ClickHouse and Gateway/Atlas consume.
message TimelinePoint {
  google.protobuf.Timestamp ts = 1;
  double value = 2;
}

message OddsPoint {
  google.protobuf.Timestamp ts = 1;
  double home = 2;
  double draw = 3;
  double away = 4;
}

message MarketSnapshot {
  string match_id = 1;
  int64 state_version = 2;
  double home_consensus_odd = 3;
  double draw_consensus_odd = 4;
  double away_consensus_odd = 5;
  int32 n_bookmakers_valid = 6;
  google.protobuf.Timestamp watermark_event_ts = 7;
}

message PressureSeriesRequest {
  string match_id = 1;
  optional int32 max_points = 2;
  optional google.protobuf.Timestamp from = 3;
}

message PressureSeriesResponse {
  repeated TimelinePoint points = 1;
}

message OddsSeriesRequest {
  string match_id = 1;
  optional int32 max_points = 2;
  optional google.protobuf.Timestamp from = 3;
}

message OddsSeriesResponse {
  repeated OddsPoint points = 1;
}

message MarketSnapshotRequest {
  string match_id = 1;
}

message MetricTicksRequest {
  string match_id = 1;
  optional int32 max_points = 2;
}

message MetricTickRow {
  google.protobuf.Timestamp ts = 1;
  double human_pressure_home = 2;
  double human_pressure_away = 3;
  double shock_score = 4;
  double xp_home = 5;
  double xp_away = 6;
  int64 state_version = 7;
}

message MetricTicksResponse {
  repeated MetricTickRow rows = 1;
}

service QueryService {
  rpc PressureSeries(PressureSeriesRequest) returns (PressureSeriesResponse);
  rpc OddsSeries(OddsSeriesRequest) returns (OddsSeriesResponse);
  rpc LatestSnapshot(MarketSnapshotRequest) returns (MarketSnapshot);
  rpc MetricTicks(MetricTicksRequest) returns (MetricTicksResponse);
}
