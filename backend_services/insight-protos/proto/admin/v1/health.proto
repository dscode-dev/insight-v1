syntax = "proto3";

package admin.v1;

option go_package = "github.com/konoha-labs/insight-protos/gen/go/admin/v1;adminv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

message ServiceHealth {
  string service_name = 1;
  HealthStatus status = 2;
  // Free-form one-liner — what's degraded / why unhealthy.
  string reason = 3;
  google.protobuf.Timestamp checked_at = 4;
  // Latency of the underlying probe (the time spent in Admin's poll).
  int32 probe_latency_ms = 5;
}

message ListServicesResponse {
  repeated ServiceHealth services = 1;
}

message GetServiceRequest {
  string service_name = 1;
}

service HealthService {
  rpc ListServices(google.protobuf.Empty) returns (ListServicesResponse);
  rpc GetService(GetServiceRequest) returns (ServiceHealth);
}
