apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insight-social
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: insight-social
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # gRPC port: callable only by insight-gateway.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: insight-gateway
      ports:
        - protocol: TCP
          port: 50051
    # HTTP port: probes (kubelet — uses node CIDR, ignored by NP) and
    # Prometheus scrape from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS (kube-dns).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres (managed external — egress to anywhere on 5432; tighten
    # to the managed instance CIDR once it's known).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    # Redis (in-cluster).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # OTLP collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
