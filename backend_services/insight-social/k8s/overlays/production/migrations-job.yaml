apiVersion: batch/v1
kind: Job
metadata:
  name: insight-social-migrate
  annotations:
    # Argo PreSync hook — runs before the Deployment rolls. If migrations
    # fail the sync aborts and the old replicas keep serving. Deleted
    # after successful sync so the next release re-creates a fresh Job.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0       # don't retry — a failed migration must be inspected
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insight-social
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          image: ghcr.io/konoha-labs/insight-social:stable
          # goose CLI is shipped in the same image (see Dockerfile).
          # Run `up` against $DATABASE_URL. Migrations dir baked at /app.
          command: ["/usr/local/bin/goose"]
          args:
            - "-dir"
            - "/app/migrations"
            - "postgres"
            - "$(DATABASE_URL)"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insight-social-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
