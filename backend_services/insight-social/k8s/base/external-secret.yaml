apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: insight-social-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: insight-vault
    kind: ClusterSecretStore
  target:
    name: insight-social-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # Logical DB `insight_social` on the shared managed Postgres
    # cluster (Phase 3 decision). The legacy service read/wrote the same
    # database during overlap — schema is locked, no dual-writes
    # because Strangler routes each endpoint to exactly one runtime.
    - secretKey: DATABASE_URL
      remoteRef:
        key: insight/social
        property: database_url
    # Shared Redis instance — namespace per-purpose via key prefixes.
    # Social uses `insight:social:*` + the HumanSignal stream keys.
    - secretKey: REDIS_URL
      remoteRef:
        key: insight/shared
        property: redis_url
