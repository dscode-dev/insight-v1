apiVersion: v1
kind: Service
metadata:
  name: insight-social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: insight-social
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Headless variant so insight-gateway's gRPC client load-balances over
# pod IPs directly (round-robin via the standard DNS resolver) instead
# of relying on the ClusterIP's stateful balancing — which is poor for
# long-lived gRPC connections.
apiVersion: v1
kind: Service
metadata:
  name: insight-social-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: insight-social
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
