apiVersion: v1
kind: ConfigMap
metadata:
  name: insight-social-config
data:
  # gRPC server bind. Cluster Service exposes 50051 → 50051.
  GRPC_ADDR: ":50051"
  # HTTP listener for /healthz, /readyz, /metrics. Separate from gRPC
  # so kube probes + Prometheus scrape with their standard conventions.
  HTTP_ADDR: ":8080"

  # Postgres pool sizing. Keep total = base + burst ≤ Postgres
  # max_connections / (replicas * services-sharing-DB). insight_social
  # is the only writer in W2 so 30 ceiling is safe.
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"

  # Redis HumanSignal target — same partitions as gateway broker (8)
  # so subscribers don't miss events across shards.
  HUMAN_SIGNAL_STREAM_PREFIX: "insight:stream:human_signal"
  STREAM_PARTITIONS: "8"

  # gRPC msg ceiling. 4 MiB is enough for any social aggregate
  # response — Discussion list pages cap at ~64 KiB each.
  GRPC_MAX_RECV_MSG_BYTES: "4194304"

  # mTLS — cert-manager mounts the bundle at this path. Set to empty
  # in local-lab overlay so the server runs plaintext.
  TLS_CERT_PATH: "/var/run/secrets/tls/tls.crt"
  TLS_KEY_PATH:  "/var/run/secrets/tls/tls.key"
  TLS_CA_PATH:   "/var/run/secrets/tls/ca.crt"

  # Observability. Sample at the collector — keep SDK at 1.0 and let
  # the collector trim. Aligns with insight-gateway.
  INSIGHT_OTLP_SAMPLE_RATIO: "1.0"

  # Migrations applied as a Job in prod overlay; in-process flag stays
  # OFF here so we never accidentally run them twice in a rolling
  # deploy. Local-lab overlay flips it to "true".
  AUTO_APPLY_MIGRATIONS: "false"
