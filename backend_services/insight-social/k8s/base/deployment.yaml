apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight-social
spec:
  # Overlay patches replicas (1 in lab, ≥2 in prod for rolling deploys).
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: insight-social
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insight-social
      annotations:
        # Prometheus scrapes the HTTP listener — gRPC server is on a
        # different port and exposed only to other workloads.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: insight-social
          image: ghcr.io/konoha-labs/insight-social:dev  # overlay sets real tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: insight-social-config
          env:
            - name: INSIGHT_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insight-social-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: insight-social-secrets
                  key: REDIS_URL
          # Probes against the HTTP listener — fast, no gRPC client
          # gymnastics, and kube's TCP-only probe shouldn't be the
          # arbiter of readiness when downstream DB might be down.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /var/run/secrets/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: insight-social-tls
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
