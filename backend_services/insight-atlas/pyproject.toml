[tool.poetry]
name = "insight-atlas"
version = "0.1.0"
description = "Atlas (Insight Layer M) — ML context layer for contextual intelligence, pattern discovery, anomaly detection. NOT a betting predictor."
authors = ["KonohaLabs <dev@konohalabs.com>"]
packages = [{ include = "atlas" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# HTTP / API
fastapi = "^0.128.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
httpx = "^0.28.0"

# Domain
pydantic = "^2.12.0"
pydantic-settings = "^2.7.0"
orjson = "^3.10.15"
pyarrow = "^3.12"

# Persistence
redis = "^5.2.0"
sqlalchemy = { version = "^2.0.38", extras = ["asyncio"] }
asyncpg = "^0.31.0"
alembic = "^1.14.0"

# ML — pinned conservative versions. Tree models + clustering only.
# No LLMs, no torch, no transformers.
numpy = "^2.4.0"
scikit-learn = "^1.9.0"
xgboost = "^2.1.4"
lightgbm = "^4.6.0"
hdbscan = "^0.8.40"
joblib = "^1.4.2"

# Observability
prometheus_client = "^0.21.0"
grpcio = "^1.68.0"
protobuf = "^5.29.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.3"
pytest = "^8.0"
pytest-asyncio = "^0.24"
fakeredis = "^2.23"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
