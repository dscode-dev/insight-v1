apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight-gateway
  namespace: insight
  labels:
    app.kubernetes.io/name: insight-gateway
    app.kubernetes.io/component: edge-gateway
    app.kubernetes.io/part-of: insight
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insight-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insight-gateway
        app.kubernetes.io/component: edge-gateway
        app.kubernetes.io/part-of: insight
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: insight-gateway
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: konohalabs/insight-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: INSIGHT_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['app.kubernetes.io/version']
          envFrom:
            - configMapRef:
                name: insight-gateway-config
            - secretRef:
                name: insight-gateway-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # mTLS materials for outbound gRPC (W1.2+); the cert lives
            # ready even when the binary doesn't use it yet.
            - name: tls
              mountPath: /var/run/secrets/tls
              readOnly: true
            # W2.2: dedicated client cert for outbound gRPC to
            # insight-social. Separate Secret (not reusing
            # insight-gateway-tls) so the social CA bundle can rotate
            # independently of the gateway's edge cert.
            - name: social-tls
              mountPath: /var/run/secrets/social-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: insight-gateway-tls
        - name: social-tls
          secret:
            secretName: insight-gateway-social-tls
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: insight-gateway
                topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: insight-gateway
  namespace: insight
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insight-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insight-gateway
  namespace: insight
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insight-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
