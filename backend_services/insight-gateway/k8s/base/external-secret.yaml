# external-secrets ExternalSecret — synthesises a K8s Secret from
# Vault. The pod consumes via envFrom: secretRef in deployment.yaml.
#
# Secrets sourced:
#   * DATABASE_URL  → secret/insight/gateway:database_url
#   * REDIS_URL     → secret/insight/gateway:redis_url
#   * JWT_SIGNING_KEY → secret/insight/shared:jwt_signing_key (shared
#     with the legacy BFF during the Strangler overlap)
#
# Lab overlay overrides storeRef to use insight-local-lab.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: insight-gateway-secrets
  namespace: insight
  labels:
    app.kubernetes.io/name: insight-gateway
    app.kubernetes.io/part-of: insight
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: insight-vault
    kind: ClusterSecretStore
  target:
    name: insight-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: insight/gateway
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: insight/gateway
        property: redis_url
    # JWT key was shared with the legacy BFF (same JWT_SIGNING_KEY).
    # Sharing the key is what makes Strangler-style endpoint cutover
    # possible without invalidating live sessions.
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: insight/shared
        property: jwt_signing_key
    # OTP HMAC is GATEWAY-OWNED — the legacy BFF used its own value during
    # the overlap. Acceptable because OTP challenges are short-lived
    # (10min): when gateway-go takes over an OTP endpoint, in-flight
    # legacy challenges simply expire — users get a 410 and
    # re-request.
    - secretKey: OTP_HMAC_SECRET
      remoteRef:
        key: insight/gateway
        property: otp_hmac_secret
    # Atlas authenticates at the public Gateway boundary with this key.
    - secretKey: ATLAS_ANVIL_API_KEY
      remoteRef:
        key: insight/gateway
        property: atlas_anvil_api_key
    # Gateway authenticates independently to the private Anvil endpoint.
    - secretKey: ANVIL_API_KEY
      remoteRef:
        key: insight/anvil
        property: feature_api_key
    # SMS provider tokens — only the configured provider's secret
    # needs to be present. ESO populates whichever keys exist in Vault.
    - secretKey: ZENVIA_API_TOKEN
      remoteRef:
        key: insight/gateway
        property: zenvia_api_token
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: insight/gateway
        property: twilio_account_sid
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: insight/gateway
        property: twilio_auth_token
    - secretKey: TWILIO_FROM_NUMBER
      remoteRef:
        key: insight/gateway
        property: twilio_from_number
